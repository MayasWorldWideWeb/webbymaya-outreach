name: WebByMaya Outreach

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      zone:
        description: 'Specific zone (blank = next in rotation)'
        required: false
        default: ''
      sms_limit:
        description: 'Max SMS to send'
        required: false
        default: '200'
      email_limit:
        description: 'Max emails to send'
        required: false
        default: '50'
      dry_run:
        description: 'Dry run - find and enrich only, no sends'
        required: false
        default: 'false'

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 ddgs googlemaps twilio sendgrid

      - name: Load zone state
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 ci_load_state.py

      - name: Set zone override
        if: ${{ github.event.inputs.zone != '' }}
        env:
          INPUT_ZONE: ${{ github.event.inputs.zone }}
        run: python3 ci_set_zone.py

      - name: Find prospects
        env:
          YELP_API_KEY:  ${{ secrets.YELP_API_KEY }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: python3 scheduled_find.py

      # Businesses that came up empty are remembered across runs so the next
      # day doesn't re-search them. This is what keeps the job from creeping
      # back toward the 30-minute timeout as the prospect pool grows.
      - name: Restore enrichment negative cache
        uses: actions/cache@v4
        with:
          path: .enrich_negative_cache.json
          key: enrich-negcache-${{ github.run_id }}
          restore-keys: enrich-negcache-

      - name: Enrich emails
        run: |
          TODAY=$(date +%Y-%m-%d)
          CSV="prospects_${TODAY}.csv"
          if [ -f "$CSV" ]; then
            # --all --search: this is a free cloud runner, so keep the full
            # yield here. ~95% of emails found come from the search fallback on
            # businesses that have no website of their own to scrape.
            python3 enrich_emails.py --input "$CSV" --all --search
          else
            echo "No prospects CSV for today, skipping"
          fi

      # bounce_log.csv is gitignored, so a fresh checkout has no do-not-mail
      # list at all. Since cold sending moved here on 08-09 that meant every
      # cloud send skipped ~470 unverified pairings, the Brevo bounces and the
      # Supabase unsubscribes — suppressing only what SendGrid knew about.
      # Pull the real list before anything decides who to mail.
      - name: Load suppression list
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python3 sync_suppressions.py --pull
          # wc -l lies here: bounce reason text contains newlines, so rows wrap.
          python3 -c "import csv;print('Suppressed addresses on file:',sum(1 for _ in csv.DictReader(open('bounce_log.csv',newline=''))))"

      - name: Check bounces
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 check_bounces.py

      # BREVO_* were never set here. send_email() goes brevo2 → sendgrid →
      # brevo1, so without them every cloud send fell through to SendGrid —
      # which has had zero credits since 2026-07-27 and answers 401. The job
      # still exited 0, so Actions stayed green while sending nothing: 262
      # attempted / 0 sent on 08-10, 51 / 0 on 08-07. It only became visible
      # when cold acquisition moved here on 08-09 and stopped running locally.
      - name: Send outreach
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TWILIO_ACCOUNT_SID:  ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          SENDGRID_API_KEY:    ${{ secrets.SENDGRID_API_KEY }}
          BREVO_API_KEY:       ${{ secrets.BREVO_API_KEY }}
          BREVO_API_KEY_2:     ${{ secrets.BREVO_API_KEY_2 }}
          BREVO_SMTP_LOGIN:    ${{ secrets.BREVO_SMTP_LOGIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 scheduled_send.py --sms-limit ${{ github.event.inputs.sms_limit || '200' }} --email-limit ${{ github.event.inputs.email_limit || '50' }}

      # A run that sends nothing must not report success. scheduled_send exits 0
      # whether it sent 262 or 0, which is how a dead provider hid for weeks.
      - name: Fail if nothing was sent
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          python3 - <<'PY'
          import csv, datetime, pathlib, sys
          p = pathlib.Path(f"send_log_{datetime.date.today().isoformat()}.csv")
          if not p.exists():
              print("No send log — nothing was attempted today."); sys.exit(0)
          rows = list(csv.DictReader(p.open(newline="")))
          sent = sum(1 for r in rows if r.get("status") == "sent")
          failed = sum(1 for r in rows if r.get("status") == "failed")
          print(f"sent={sent} failed={failed}")
          if failed and not sent:
              sys.exit(f"Every send failed ({failed}/{failed}). Provider is down — not reporting success.")
          PY

      - name: Save zone state
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python3 ci_save_state.py
